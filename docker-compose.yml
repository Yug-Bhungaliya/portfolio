services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - task-manager-network

  backend:
    build:
      context: ./task-manager-api
    env_file:
      - path: ./task-manager-api/.env
        required: false
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/taskdb
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - task-manager-network

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - task-manager-network

volumes:
  mongodb-data:

networks:
  task-manager-network:
    driver: bridge
